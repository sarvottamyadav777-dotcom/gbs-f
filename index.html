<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GB STUDY | Premium Batches</title>
    <meta name="description" content="GB STUDY - Premium batches, video lectures, notes, and study material portal." />
    <meta property="og:title" content="GB STUDY | Premium Batches" />
    <meta property="og:description" content="GB STUDY - Premium batches, video lectures, notes, and study material portal." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://i.ibb.co/Q3g9fGSt/1791541921524.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#09050d', 
                        cardBg: '#130a1c',
                        themeYellow: '#FACC15',
                        themePurple: '#a855f7',
                        themeNeon: '#c084fc',
                        themeGreen: '#10B981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        html, body { background-color: #09050d; }
        body { color: #e7e5e4; overflow-x: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
        * { box-sizing: border-box; }
        
        /* Modern Blacky-Purple Background with Neon Accents */
        .page-bg { 
            background: 
                radial-gradient(800px 600px at 15% -5%, rgba(168, 85, 247, 0.12), transparent 60%), 
                radial-gradient(600px 400px at 90% 80%, rgba(250, 204, 21, 0.05), transparent 50%), 
                #09050d; 
        }
        
        .btn-click-effect { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-click-effect:active { transform: scale(0.95); }
        
        /* Glassy Premium Cards with Purple Glow */
        .premium-card { 
            background: linear-gradient(180deg, rgba(20, 10, 30, 0.8) 0%, rgba(12, 5, 18, 0.9) 100%); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.15); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .premium-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: rgba(168, 85, 247, 0.5); 
            box-shadow: 0 20px 40px -15px rgba(168, 85, 247, 0.25), 0 0 15px rgba(168, 85, 247, 0.1); 
            z-index: 10;
        }
        
        /* Staggered Animations */
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .slide-down-toast { animation: slideDownToast 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDownToast { 
            from { transform: translate(-50%, -150%); opacity: 0; } 
            to { transform: translate(-50%, 0); opacity: 1; } 
        }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glassmorphism Navigation */
        .nav-glass { 
            background: rgba(9, 5, 13, 0.7); 
            backdrop-filter: blur(20px) saturate(160%); 
            -webkit-backdrop-filter: blur(20px) saturate(160%); 
            border-bottom: 1px solid rgba(168, 85, 247, 0.15); 
        }
        
        .modal-glass { 
            background: linear-gradient(145deg, rgba(20, 10, 30, 0.95), rgba(10, 5, 15, 0.98));
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(168, 85, 247, 0.2); 
            box-shadow: 0 0 50px -10px rgba(168, 85, 247, 0.3); 
        }
        
        .animate-modal-in { animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes modalIn { 
            from { opacity: 0; transform: scale(0.92) translateY(15px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        .skel { 
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.15) 50%, rgba(168, 85, 247, 0.05) 75%); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite; 
        }
        @keyframes shimmer { 
            0% { background-position: 200% 0; } 
            100% { background-position: -200% 0; } 
        }
        
        /* Neon Inputs */
        input:focus {
            box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.5), 0 0 10px rgba(168, 85, 247, 0.2);
        }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="min-h-screen relative flex flex-col font-sans page-bg pb-16">
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] hidden items-center gap-3 px-6 py-3 rounded-full font-bold text-sm shadow-[0_10px_40px_rgba(168,85,247,0.3)] border transition-all duration-300">
        <i data-lucide="info" id="toast-icon" class="w-4 h-4"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-[9990] hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-opacity">
        <div class="modal-glass w-full max-w-sm rounded-3xl p-7 relative overflow-hidden animate-modal-in">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-stone-500 hover:text-white transition-colors p-1.5 rounded-full hover:bg-white/10">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="text-center mb-7">
                <div class="mx-auto mb-4 w-14 h-14 rounded-2xl overflow-hidden border-2 border-themePurple/30 shadow-[0_0_15px_rgba(168,85,247,0.4)]">
                    <img src="/logo.png" onerror="this.src='https://i.ibb.co/Q3g9fGSt/1791541921524.png'" alt="GB STUDY" class="w-full h-full object-cover">
                </div>
                <h2 class="text-2xl font-black text-white font-syne mb-1 tracking-tight drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]">WELCOME BACK</h2>
                <p class="text-xs text-stone-400">Login to unlock batches</p>
            </div>
            
            <div id="login-loader" class="hidden absolute inset-0 bg-[#0a050f]/95 backdrop-blur-md z-10 flex flex-col items-center justify-center">
                <i data-lucide="loader-2" class="w-10 h-10 text-themePurple animate-spin mb-3"></i>
                <span id="login-loader-text" class="text-xs font-bold text-white tracking-widest uppercase bg-gradient-to-r from-themePurple to-themeNeon bg-clip-text text-transparent">Processing...</span>
            </div>
            
            <div id="login-error" class="hidden mb-5 bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3.5 rounded-xl flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
                <span id="login-error-text"></span>
            </div>
            
            <div id="step-phone" class="flex flex-col gap-4">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="phone" class="w-4 h-4 text-themePurple"></i>
                    </div>
                    <input type="tel" id="login-phone" placeholder="Enter 10-digit number" maxlength="10" inputmode="numeric" class="w-full bg-black/40 border border-white/10 text-white text-sm rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:border-themePurple transition-all">
                </div>
                <button onclick="sendOTP()" class="w-full bg-gradient-to-r from-themePurple to-purple-500 text-white font-bold text-sm py-3.5 rounded-xl hover:opacity-90 transition-opacity shadow-[0_0_20px_rgba(168,85,247,0.4)] btn-click-effect">Get OTP</button>
            </div>
            
            <div id="step-otp" class="hidden flex-col gap-4">
                <p class="text-xs text-stone-400 text-center">OTP sent to <span id="display-phone" class="text-themeNeon font-bold"></span> <button onclick="resetLoginForm()" class="text-stone-300 underline ml-1 hover:text-white">Edit</button></p>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="key-round" class="w-4 h-4 text-themePurple"></i>
                    </div>
                    <input type="number" id="login-otp" placeholder="Enter OTP" class="w-full bg-black/40 border border-white/10 text-white text-sm rounded-xl pl-11 pr-4 py-3.5 focus:outline-none focus:border-themePurple transition-all tracking-[0.4em] text-center font-bold">
                </div>
                <button onclick="verifyOTP()" class="w-full bg-white text-black font-bold text-sm py-3.5 rounded-xl hover:bg-gray-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.2)] btn-click-effect">Verify & Proceed</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="w-full z-40 nav-glass h-[70px] sticky top-0">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer btn-click-effect group" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-black border border-themePurple/30 rounded-xl flex items-center justify-center overflow-hidden shadow-[0_0_15px_rgba(168,85,247,0.2)] group-hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all">
                    <img src="/logo.png" onerror="this.src='https://i.ibb.co/Q3g9fGSt/1791541921524.png'" alt="GB STUDY" class="w-full h-full object-cover">
                </div>
                <h1 class="text-xl font-black tracking-wider text-white font-syne drop-shadow-md">GB<span class="text-themePurple drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]"> STUDY</span></h1>
            </div>
            <div class="hidden md:flex items-center gap-6">
                <button onclick="switchTab('new')" class="text-white hover:text-themePurple font-bold text-sm transition-colors flex items-center gap-2 btn-click-effect">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Batches
                </button>
                <button onclick="switchTab('wishlist')" class="text-stone-400 hover:text-white font-bold text-sm transition-colors flex items-center gap-2">
                    <i data-lucide="bookmark" class="w-4 h-4"></i> My Enrollments
                </button>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchTab('wishlist')" class="md:hidden text-stone-300 p-2.5 border border-white/10 rounded-xl hover:text-themePurple hover:border-themePurple/40 transition-colors btn-click-effect relative bg-white/5">
                    <i data-lucide="bookmark" class="w-5 h-5"></i>
                    <span id="mobile-wishlist-indicator" class="absolute -top-1 -right-1 w-3 h-3 bg-themePurple border-2 border-[#09050d] rounded-full hidden shadow-[0_0_8px_rgba(168,85,247,0.8)]"></span>
                </button>
                <button id="auth-btn" onclick="toggleAuthStatus()" class="text-white bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold hover:bg-white/10 hover:border-themePurple/40 transition-all flex items-center gap-2 shadow-sm">
                    <i data-lucide="user" class="w-4 h-4"></i> <span id="auth-btn-text">Login</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[90rem] mx-auto px-4 sm:px-6 pt-8 relative z-10">
        
        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-5 mb-8 fade-in-up">
            <div class="flex items-center gap-2 overflow-x-auto hide-scroll w-full md:w-auto p-1.5 bg-[#130a1c]/80 backdrop-blur-md rounded-2xl border border-white/5 shadow-inner">
                <button id="tab-new" onclick="switchTab('new')" class="tab-btn active shrink-0 px-4 sm:px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all bg-themePurple/10 text-white border border-themePurple/30 flex items-center gap-2 shadow-[0_0_15px_rgba(168,85,247,0.15)]">
                    <i data-lucide="sparkles" class="w-4 h-4 text-themeNeon"></i>
                    Latest <span class="hidden sm:inline">Batches</span>
                    <!-- Total Batches Count Badge -->
                    <span id="total-batch-count" class="bg-themePurple/30 text-themeNeon ml-1 px-2 py-0.5 rounded-md text-[10px] font-black border border-themePurple/20">0</span>
                </button>
                <button id="tab-wishlist" onclick="switchTab('wishlist')" class="tab-btn shrink-0 px-4 sm:px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all bg-transparent text-stone-400 hover:text-stone-200 border border-transparent flex items-center gap-2">
                    <i data-lucide="bookmark" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">My </span>Enrolled
                    <span id="wishlist-count" class="bg-themeGreen/20 text-themeGreen border border-themeGreen/30 text-[10px] font-black px-2 py-0.5 rounded-md hidden">0</span>
                </button>
            </div>
            
            <div class="relative w-full md:w-[380px] group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-themePurple">
                    <i data-lucide="search" class="w-4.5 h-4.5 text-stone-500 group-focus-within:text-themePurple transition-colors"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search batches..." class="w-full bg-[#130a1c]/80 backdrop-blur-md border border-white/10 text-white text-sm rounded-2xl block pl-11 pr-11 py-3.5 transition-all placeholder:text-stone-600 focus:outline-none focus:border-themePurple/60 focus:bg-[#1a0f26] shadow-inner">
                <button id="clearSearchBtn" onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-stone-500 hover:text-themeNeon hidden transition-colors">
                    <i data-lucide="x" class="w-4.5 h-4.5"></i>
                </button>
            </div>
        </div>

        <!-- Skeletons -->
        <div id="loadingIndicator" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="rounded-2xl overflow-hidden border border-white/5 bg-[#130a1c]"><div class="aspect-video skel"></div><div class="p-5 space-y-4"><div class="h-3 w-5/6 rounded skel"></div><div class="h-3 w-2/3 rounded skel"></div><div class="h-10 w-full rounded-xl skel mt-5"></div></div></div>
            <div class="rounded-2xl overflow-hidden border border-white/5 bg-[#130a1c] hidden sm:block"><div class="aspect-video skel"></div><div class="p-5 space-y-4"><div class="h-3 w-5/6 rounded skel"></div><div class="h-3 w-2/3 rounded skel"></div><div class="h-10 w-full rounded-xl skel mt-5"></div></div></div>
            <div class="rounded-2xl overflow-hidden border border-white/5 bg-[#130a1c] hidden lg:block"><div class="aspect-video skel"></div><div class="p-5 space-y-4"><div class="h-3 w-5/6 rounded skel"></div><div class="h-3 w-2/3 rounded skel"></div><div class="h-10 w-full rounded-xl skel mt-5"></div></div></div>
            <div class="rounded-2xl overflow-hidden border border-white/5 bg-[#130a1c] hidden xl:block"><div class="aspect-video skel"></div><div class="p-5 space-y-4"><div class="h-3 w-5/6 rounded skel"></div><div class="h-3 w-2/3 rounded skel"></div><div class="h-10 w-full rounded-xl skel mt-5"></div></div></div>
        </div>

        <!-- Batch Grid -->
        <div id="batchGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
        
        <!-- Load More -->
        <div id="loadMoreContainer" class="w-full flex justify-center mt-12 mb-8 hidden fade-in-up">
            <button id="loadMoreBtn" onclick="loadMore()" class="px-8 py-3 bg-[#130a1c]/80 backdrop-blur-md border border-themePurple/30 hover:border-themePurple hover:bg-themePurple/10 rounded-2xl text-white font-bold text-sm transition-all btn-click-effect flex items-center gap-2 shadow-[0_0_15px_rgba(168,85,247,0.1)] hover:shadow-[0_0_25px_rgba(168,85,247,0.25)]">
                Load More Batches <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-24 text-center fade-in-up">
            <div class="w-20 h-20 bg-[#130a1c] rounded-full flex items-center justify-center mb-5 border border-white/5 shadow-inner">
                <i data-lucide="folder-search" class="w-10 h-10 text-stone-600"></i>
            </div>
            <h3 class="text-2xl font-black text-white mb-2 tracking-tight">No Batches Found</h3>
            <p class="text-stone-400 text-sm max-w-xs">Try adjusting your search terms or enroll in new batches to see them here.</p>
        </div>
    </main>

    <script>
        lucide.createIcons();
        let currentUser = JSON.parse(localStorage.getItem('gbstudy_user') || localStorage.getItem('nexthope_user') || localStorage.getItem('studybee_user') || 'null');
        let currentPhoneForLogin = "";
        let pendingAction = null;
        
        function updateAuthUI() {
            const btnText = document.getElementById('auth-btn-text');
            const authBtn = document.getElementById('auth-btn');
            if (currentUser && currentUser.token) {
                btnText.innerText = currentUser.name ? currentUser.name.split(' ')[0] : 'Logout';
                authBtn.classList.add('text-themeNeon', 'border-themePurple/40', 'bg-themePurple/10');
            } else {
                btnText.innerText = 'Login';
                authBtn.classList.remove('text-themeNeon', 'border-themePurple/40', 'bg-themePurple/10');
            }
        }
        updateAuthUI();
        
        function toggleAuthStatus() {
            if (currentUser && currentUser.token) {
                if (confirm("Are you sure you want to logout?")) {
                    localStorage.removeItem('gbstudy_user');
                    localStorage.removeItem('nexthope_user');
                    localStorage.removeItem('studybee_user');
                    currentUser = null;
                    updateAuthUI();
                    showToast("Logged out successfully", "success");
                }
            } else { openLoginModal(); }
        }
        
        function checkAuth(callback) {
            if (currentUser && currentUser.token) { callback(); }
            else { pendingAction = callback; openLoginModal(); }
        }
        
        function openLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            resetLoginForm();
            setTimeout(() => document.getElementById('login-phone').focus(), 100);
        }
        
        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingAction = null;
        }
        
        function showLoginLoader(text) {
            document.getElementById('login-loader').classList.remove('hidden');
            document.getElementById('login-loader-text').innerText = text;
            document.getElementById('login-error').classList.add('hidden');
        }
        
        function hideLoginLoader() { document.getElementById('login-loader').classList.add('hidden'); }
        
        function showLoginError(msg) {
            hideLoginLoader();
            document.getElementById('login-error').classList.remove('hidden');
            document.getElementById('login-error-text').innerText = msg;
        }
        
        function resetLoginForm() {
            document.getElementById('step-otp').classList.add('hidden');
            document.getElementById('step-phone').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-otp').value = "";
            document.getElementById('login-phone').value = "";
        }
        
        async function sendOTP() {
            const phone = document.getElementById('login-phone').value.trim();
            if (phone.length !== 10) { showLoginError("Enter a valid 10-digit number."); return; }
            currentPhoneForLogin = phone;
            showLoginLoader("Sending OTP...");
            try {
                const response = await fetch(`/login?phone=${phone}`);
                const data = await response.json();
                if (data.status === 200 || response.ok) {
                    hideLoginLoader();
                    document.getElementById('step-phone').classList.add('hidden');
                    document.getElementById('step-otp').classList.remove('hidden');
                    document.getElementById('display-phone').innerText = phone;
                    setTimeout(() => document.getElementById('login-otp').focus(), 50);
                } else { throw new Error(data.message || "Failed to send OTP"); }
            } catch (error) { showLoginError(error.message); }
        }
        
        async function verifyOTP() {
            const otp = document.getElementById('login-otp').value.trim();
            if (!otp) { showLoginError("Please enter the OTP."); return; }
            showLoginLoader("Verifying...");
            try {
                const response = await fetch(`/login?phone=${currentPhoneForLogin}&otp=${otp}`);
                const data = await response.json();
                if (data.success && data.user) {
                    currentUser = { token: data.user.token, userid: data.user.userid, name: data.user.name, phone: data.user.phone };
                    localStorage.setItem('gbstudy_user', JSON.stringify(currentUser));
                    localStorage.setItem('nexthope_user', JSON.stringify(currentUser));
                    localStorage.setItem('studybee_user', JSON.stringify(currentUser));
                    updateAuthUI();
                    document.getElementById('login-loader-text').innerText = "Login Successful!";
                    setTimeout(() => {
                        closeLoginModal();
                        showToast("Welcome back!", "success");
                        if (pendingAction) { pendingAction(); pendingAction = null; }
                    }, 700);
                } else { throw new Error(data.message || "Invalid OTP"); }
            } catch (error) { showLoginError(error.message); }
        }
        
        document.getElementById('login-phone').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendOTP(); });
        document.getElementById('login-otp').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyOTP(); });
        
        window.showToast = function(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 z-[9999] flex items-center gap-2.5 px-5 py-3 rounded-2xl font-semibold text-sm border slide-down-toast backdrop-blur-md`;
            
            if (type === 'success') {
                toast.classList.add('bg-[#130a1c]', 'border-themePurple/50', 'text-white', 'shadow-[0_10px_30px_rgba(168,85,247,0.3)]');
                icon.className = "w-4 h-4 text-themeNeon";
                icon.setAttribute('data-lucide', 'check-circle-2');
            } else {
                toast.classList.add('bg-red-950/80', 'border-red-500/50', 'text-red-200');
                icon.className = "w-4 h-4 text-red-400";
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            
            document.getElementById('toast-msg').innerText = msg;
            lucide.createIcons({ root: toast });
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('flex');
                    toast.style = '';
                }, 300);
            }, 3000);
        };
        
        window.handleStudyClick = function(event, batchId) {
            event.preventDefault();
            checkAuth(() => { window.location.href = `content.html?id=${batchId}`; });
        };
        
        window.toggleEnroll = function(event, batchId) {
            event.stopPropagation();
            checkAuth(() => {
                batchId = String(batchId);
                const index = wishlist.indexOf(batchId);
                const container = document.getElementById(`enroll-container-${batchId}`);
                if (index === -1) {
                    wishlist.push(batchId);
                    showToast("Added to your enrollments!", "success");
                    if (container) container.innerHTML = `<button onclick="toggleEnroll(event, '${batchId}')" class="bg-themeGreen/15 text-themeGreen border border-themeGreen/30 px-3.5 py-2 rounded-xl text-[11px] font-black tracking-wider flex items-center gap-1.5 hover:bg-themeGreen/25 transition-colors shadow-inner"><i data-lucide="check" class="w-3.5 h-3.5"></i> ENROLLED</button>`;
                } else {
                    wishlist.splice(index, 1);
                    if (container) container.innerHTML = `<button onclick="toggleEnroll(event, '${batchId}')" class="bg-gradient-to-r from-themePurple to-purple-600 hover:opacity-90 text-white px-3.5 py-2 rounded-xl text-[11px] font-black tracking-wider flex items-center gap-1.5 transition-all btn-click-effect shadow-[0_4px_10px_rgba(168,85,247,0.3)]"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ENROLL</button>`;
                    if (currentTab === 'wishlist') applyFiltersAndRender(true);
                }
                localStorage.setItem('gbstudy_wishlist', JSON.stringify(wishlist));
                localStorage.setItem('nexthope_wishlist', JSON.stringify(wishlist));
                localStorage.setItem('studybee_wishlist', JSON.stringify(wishlist));
                updateWishlistCount();
                lucide.createIcons();
            });
        };
        
        let batchesData = { new: [] };
        let currentTab = 'new';
        let wishlist = JSON.parse(localStorage.getItem('gbstudy_wishlist') || localStorage.getItem('nexthope_wishlist') || localStorage.getItem('studybee_wishlist') || '[]').map(String);
        const ITEMS_PER_PAGE = 12;
        let currentlyDisplayedCount = 0;
        let currentFilteredData = [];
        let searchTimer = null;
        
        const batchGrid = document.getElementById('batchGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const totalBatchCountEl = document.getElementById('total-batch-count');
        
        document.addEventListener('DOMContentLoaded', () => { updateWishlistCount(); fetchBatches(); });
        
        async function fetchBatches() {
            try {
                const response = await fetch('batches.json');
                if (!response.ok) throw new Error("Failed to load JSON");
                const rawData = await response.json();
                batchesData.new = [...(rawData.new || []), ...(rawData.old || [])];
                
                // Set total count dynamically from JSON
                totalBatchCountEl.innerText = batchesData.new.length;
                
                loadingIndicator.classList.add('hidden');
                batchGrid.classList.remove('hidden');
                applyFiltersAndRender(true);
            } catch (error) {
                console.error("Error fetching batches:", error);
                loadingIndicator.innerHTML = `<div class="col-span-full text-center py-20"><div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20"><i data-lucide="alert-triangle" class="w-8 h-8 text-red-400"></i></div><h3 class="text-white font-bold text-lg mb-1">Failed to load batches</h3><p class="text-stone-400 text-sm">Please check your connection or try again later.</p></div>`;
                lucide.createIcons();
            }
        }
        
        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) clearSearchBtn.classList.remove('hidden');
            else clearSearchBtn.classList.add('hidden');
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => applyFiltersAndRender(true), 250);
        });
        
        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            applyFiltersAndRender(true);
            searchInput.focus();
        }
        
        window.switchTab = function(tabName) {
            currentTab = tabName;
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-themePurple/10', 'text-white', 'border-themePurple/30', 'shadow-[0_0_15px_rgba(168,85,247,0.15)]');
                btn.classList.add('bg-transparent', 'text-stone-400', 'border-transparent');
            });
            
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.remove('bg-transparent', 'text-stone-400', 'border-transparent');
            activeTab.classList.add('bg-themePurple/10', 'text-white', 'border-themePurple/30', 'shadow-[0_0_15px_rgba(168,85,247,0.15)]');
            
            applyFiltersAndRender(true);
        };
        
        function applyFiltersAndRender(resetPagination = false) {
            const query = searchInput.value.toLowerCase().trim();
            if (currentTab === 'wishlist') {
                const allBatches = batchesData.new;
                const uniqueBatches = Array.from(new Map(allBatches.map(item => [String(item.id), item])).values());
                currentFilteredData = uniqueBatches.filter(batch => wishlist.includes(String(batch.id)));
            } else { currentFilteredData = batchesData[currentTab] || []; }
            
            if (query) currentFilteredData = currentFilteredData.filter(batch => batch.title.toLowerCase().includes(query) || String(batch.id).includes(query));
            if (resetPagination) { currentlyDisplayedCount = 0; batchGrid.innerHTML = ''; }
            
            renderBatchSlice();
        }
        
        function renderBatchSlice() {
            if (currentFilteredData.length === 0) {
                batchGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                loadMoreContainer.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            batchGrid.classList.remove('hidden');
            
            const nextCount = Math.min(currentlyDisplayedCount + ITEMS_PER_PAGE, currentFilteredData.length);
            const itemsToRender = currentFilteredData.slice(currentlyDisplayedCount, nextCount);
            
            const html = itemsToRender.map((batch, index) => createCardHTML(batch, index)).join('');
            if (currentlyDisplayedCount === 0) batchGrid.innerHTML = html;
            else batchGrid.insertAdjacentHTML('beforeend', html);
            
            currentlyDisplayedCount = nextCount;
            lucide.createIcons();
            
            if (currentlyDisplayedCount < currentFilteredData.length) loadMoreContainer.classList.remove('hidden');
            else loadMoreContainer.classList.add('hidden');
        }
        
        window.loadMore = function() {
            const btn = document.getElementById('loadMoreBtn');
            if (btn.disabled) return;
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-themeNeon"></i> <span class="text-themeNeon">Loading...</span>`;
            lucide.createIcons();
            setTimeout(() => { renderBatchSlice(); btn.innerHTML = originalHtml; btn.disabled = false; lucide.createIcons(); }, 300);
        };
        
        function createCardHTML(batch, index) {
            const id = String(batch.id);
            const isEnrolled = wishlist.includes(id);
            const delay = (index % ITEMS_PER_PAGE * 40) + 'ms';
            const safeTitle = String(batch.title || '').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            
            const enrollBtnState = isEnrolled
                ? `<button onclick="toggleEnroll(event, '${id}')" class="bg-themeGreen/15 text-themeGreen border border-themeGreen/30 px-3.5 py-2 rounded-xl text-[11px] font-black tracking-wider flex items-center gap-1.5 hover:bg-themeGreen/25 transition-colors shadow-inner"><i data-lucide="check" class="w-3.5 h-3.5"></i> ENROLLED</button>`
                : `<button onclick="toggleEnroll(event, '${id}')" class="bg-gradient-to-r from-themePurple to-purple-600 hover:opacity-90 text-white px-3.5 py-2 rounded-xl text-[11px] font-black tracking-wider flex items-center gap-1.5 transition-all btn-click-effect shadow-[0_4px_10px_rgba(168,85,247,0.3)]"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ENROLL</button>`;
                
            return `
                <div class="premium-card rounded-[20px] overflow-hidden fade-in-up group flex flex-col relative" style="animation-delay: ${delay}">
                    <div class="relative w-full aspect-[16/9] overflow-hidden bg-[#09050d]">
                        <img src="${batch.thumbnail}" alt="${safeTitle}" loading="lazy" class="w-full h-full object-cover group-hover:scale-[1.08] transition-transform duration-700 ease-out opacity-90 group-hover:opacity-100" onerror="this.style.opacity='0'">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#130a1c] via-[#130a1c]/20 to-transparent"></div>
                        <div class="absolute top-3 right-3 bg-themePurple/20 backdrop-blur-md border border-themePurple/30 px-2.5 py-1 rounded-lg z-10 shadow-[0_0_10px_rgba(168,85,247,0.3)]">
                            <span class="text-themeNeon text-[9px] font-black tracking-widest uppercase drop-shadow-md">batch</span>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-1 relative z-10">
                        <h3 class="text-stone-200 font-bold text-sm sm:text-[15px] leading-relaxed mb-5 line-clamp-2 group-hover:text-themeNeon transition-colors drop-shadow-sm">${safeTitle}</h3>
                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5 gap-3">
                            <div id="enroll-container-${id}">${enrollBtnState}</div>
                            <button onclick="handleStudyClick(event, '${id}')" class="bg-white hover:bg-stone-200 text-black px-4 py-2 rounded-xl text-[11px] font-black uppercase tracking-wider flex items-center gap-2 transition-all btn-click-effect shadow-md">Study <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                </div>`;
        }
        
        function updateWishlistCount() {
            const countEl = document.getElementById('wishlist-count');
            const mobileIndicator = document.getElementById('mobile-wishlist-indicator');
            if (wishlist.length > 0) { 
                countEl.innerText = wishlist.length; 
                countEl.classList.remove('hidden'); 
                mobileIndicator.classList.remove('hidden'); 
            } else { 
                countEl.classList.add('hidden'); 
                mobileIndicator.classList.add('hidden'); 
            }
        }
    </script>
</body>
</html>
