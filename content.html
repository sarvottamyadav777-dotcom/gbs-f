<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Course Content | GB STUDY</title>
    <meta name="description" content="GB STUDY - Course content, lectures, notes, and study material." />
    <link rel="icon" href="/logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#09050d', 
                        cardBg: '#130a1c',
                        themeYellow: '#FACC15',
                        themePurple: '#a855f7',
                        themeNeon: '#c084fc',
                        themeGreen: '#10B981',
                        textDim: '#a8a29e'
                    },
                    fontFamily: { 
                        sans: ['Inter', 'system-ui', 'sans-serif'], 
                        syne: ['Syne', 'sans-serif'] 
                    }
                }
            }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        html { scroll-behavior: smooth; }
        body {
            background: 
                radial-gradient(800px 600px at 50% 0%, rgba(168, 85, 247, 0.15), transparent 70%), 
                #09050d;
            color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .nav-glass { 
            background: rgba(9, 5, 13, 0.7); 
            backdrop-filter: blur(20px) saturate(160%); 
            -webkit-backdrop-filter: blur(20px) saturate(160%); 
            border-bottom: 1px solid rgba(168, 85, 247, 0.15); 
        }
        
        .row-card {
            background: linear-gradient(145deg, rgba(19, 10, 28, 0.8), rgba(15, 7, 22, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }
        
        .row-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: linear-gradient(145deg, rgba(25, 12, 38, 0.9), rgba(20, 10, 30, 0.95));
            box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.25);
            transform: translateY(-3px) scale(1.01);
            z-index: 10;
        }
        
        .row-card:active { transform: scale(0.98); }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-down-toast { animation: slideDownToast 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDownToast { 
            from { transform: translate(-50%, -150%); opacity: 0; } 
            to { transform: translate(-50%, 0); opacity: 1; } 
        }
        
        .skel {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.12) 50%, rgba(168, 85, 247, 0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .btn-click-effect { transition: all 0.2s ease; }
        .btn-click-effect:active { transform: scale(0.95); }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-10">
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] hidden items-center gap-2.5 px-5 py-3 rounded-2xl font-semibold text-sm border slide-down-toast backdrop-blur-md shadow-[0_10px_40px_rgba(168,85,247,0.3)] bg-purple-900/80 border-themePurple/50 text-purple-100 transition-all duration-300">
        <i data-lucide="check-circle-2" id="toast-icon" class="w-4 h-4 text-themeNeon"></i>
        <span id="toast-msg">Link copied!</span>
    </div>

    <!-- PDF Modal Viewer -->
    <div id="pdf-modal" class="fixed inset-0 z-[9995] hidden items-center justify-center bg-black/85 backdrop-blur-md p-2 sm:p-4">
        <div class="relative w-full max-w-5xl h-[92vh] bg-[#120a1a] rounded-2xl border border-themePurple/40 shadow-2xl flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-[#180e22]">
                <div class="flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-themeNeon"></i>
                    <span id="pdf-modal-title" class="font-bold text-sm text-white truncate max-w-[200px] sm:max-w-md">Notes Viewer</span>
                </div>
                <div class="flex items-center gap-2">
                    <a id="pdf-external-link" href="#" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold text-white flex items-center gap-1.5 transition-colors">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Open in Tab
                    </a>
                    <button onclick="closePdfModal()" class="p-1.5 rounded-lg bg-white/10 hover:bg-red-500/20 text-stone-300 hover:text-white transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 w-full h-full bg-[#08040d] relative">
                <iframe id="pdf-frame" src="" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="w-full sticky top-0 z-50 nav-glass">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-[64px] sm:h-[70px] flex items-center gap-3">
            <button onclick="goBack()" class="h-9 w-9 sm:h-10 sm:w-10 rounded-xl bg-white/5 border border-white/10 text-stone-300 hover:text-white hover:bg-white/10 hover:border-themePurple/40 flex items-center justify-center btn-click-effect transition-all shadow-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 min-w-0 group">
                <img src="/logo.png" onerror="this.src='https://i.ibb.co/Q3g9fGSt/1791541921524.png'" alt="GB STUDY" class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl object-cover border border-themePurple/30 group-hover:shadow-[0_0_15px_rgba(168,85,247,0.4)] transition-all">
                <span class="text-[15px] sm:text-[17px] font-black tracking-wider text-white font-syne drop-shadow-md">GB<span class="text-themePurple drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]"> STUDY</span></span>
            </a>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 py-5 sm:py-6">
        
        <!-- Mobile Optimized Compact Hero Section -->
        <div id="course-hero" class="mb-5 fade-in-up hidden rounded-[16px] sm:rounded-[24px] overflow-hidden border border-themePurple/20 shadow-[0_8px_20px_-8px_rgba(168,85,247,0.2)] bg-gradient-to-br from-[#180d24] to-[#09050d] p-3 sm:p-5 flex-row items-center sm:items-start gap-3 sm:gap-6 relative group">
            
            <!-- Compact Image -->
            <div class="w-[120px] sm:w-[260px] aspect-video rounded-lg sm:rounded-xl overflow-hidden relative shadow-md sm:shadow-lg flex-shrink-0 border border-white/10 bg-[#050208]">
                <img id="hero-thumb" src="" alt="Course Thumbnail" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.03]">
            </div>
            
            <!-- Title & Share Button -->
            <div class="flex-1 flex flex-col justify-center items-start text-left w-full h-full py-0.5">
                <div class="bg-themePurple/20 border border-themePurple/30 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded sm:rounded-md mb-1.5 sm:mb-3 shadow-[0_0_10px_rgba(168,85,247,0.1)]">
                    <span class="text-themeNeon text-[8px] sm:text-[10px] font-black tracking-widest uppercase">batch</span>
                </div>
                
                <h1 id="hero-title" class="text-[13px] sm:text-xl md:text-2xl font-black text-white font-syne tracking-tight mb-2 sm:mb-5 line-clamp-2 drop-shadow-md leading-snug">
                    Loading...
                </h1>
                
                <button onclick="shareCourse()" class="mt-auto bg-white/5 hover:bg-white/15 border border-white/10 text-stone-200 hover:text-white px-3 py-1.5 sm:px-5 sm:py-2.5 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-bold transition-all flex items-center justify-center gap-1.5 shadow-sm btn-click-effect w-max">
                    <i data-lucide="share-2" class="w-3 h-3 sm:w-4 sm:h-4"></i> <span class="hidden sm:inline">Share Course</span><span class="sm:hidden">Share</span>
                </button>
            </div>
        </div>

        <!-- Breadcrumbs -->
        <div id="breadcrumb-container" class="flex items-center gap-1.5 overflow-x-auto pb-4 sm:pb-5 pt-1 text-[12px] sm:text-[13px] font-bold text-stone-400 whitespace-nowrap hide-scroll"></div>
        
        <!-- Skeleton Loaders -->
        <div id="loader" class="flex flex-col gap-3 sm:gap-4 py-2">
            <div class="h-[76px] sm:h-[88px] rounded-[16px] sm:rounded-[20px] skel border border-white/5"></div>
            <div class="h-[76px] sm:h-[88px] rounded-[16px] sm:rounded-[20px] skel border border-white/5"></div>
            <div class="h-[76px] sm:h-[88px] rounded-[16px] sm:rounded-[20px] skel border border-white/5"></div>
            <div class="h-[104px] sm:h-[120px] rounded-[16px] sm:rounded-[20px] skel border border-white/5"></div>
        </div>
        
        <!-- Error State -->
        <div id="error-message" class="hidden flex-col items-center justify-center py-16 sm:py-20 text-center fade-in-up">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-red-500/10 rounded-full flex items-center justify-center mb-4 border border-red-500/20 shadow-inner">
                <i data-lucide="alert-triangle" class="w-7 h-7 sm:w-8 sm:h-8 text-red-400"></i>
            </div>
            <p class="text-white font-bold text-base sm:text-lg mb-1">Could not load contents</p>
            <p id="error-text" class="text-stone-400 text-xs sm:text-sm mb-5 sm:mb-6">Something went wrong while fetching data.</p>
            <button onclick="retryFetch()" class="bg-gradient-to-r from-themePurple to-purple-600 hover:opacity-90 text-white px-5 py-2 sm:px-6 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold shadow-[0_0_15px_rgba(168,85,247,0.3)] btn-click-effect">Try Again</button>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 sm:py-24 text-center fade-in-up">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-[#130a1c] rounded-full flex items-center justify-center mb-4 sm:mb-5 border border-white/5 shadow-inner">
                <i data-lucide="folder-open" class="w-8 h-8 sm:w-10 sm:h-10 text-stone-600"></i>
            </div>
            <p class="text-white font-black text-lg sm:text-xl mb-1 sm:mb-2 tracking-tight">This folder is empty</p>
            <p class="text-stone-400 text-xs sm:text-sm">No videos, PDFs, or sub-folders found here.</p>
        </div>

        <!-- Content Grid -->
        <div id="content-grid" class="flex flex-col gap-3 sm:gap-4 hidden"></div>
    </main>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id') || urlParams.get('courseId');
        let navigationStack = [{ id: '-1', title: 'Batch Content' }];
        const UPSTREAM_BASE = 'https://science-and-fun-bb139b66c325.herokuapp.com';
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!courseId) { showError("No Course ID provided in the URL."); return; }
            fetchBatchDetails();
            loadCurrentFolder();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            
            setTimeout(() => { 
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => {
                    toast.classList.add('hidden'); 
                    toast.classList.remove('flex'); 
                    toast.style = '';
                }, 300);
            }, 3000);
        }

        function shareCourse() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("Link copied!");
            }).catch(err => {
                console.error("Could not copy text: ", err);
            });
        }

        async function resilientFetch(path) {
            try {
                const res = await fetch(path);
                if (res.ok) return res;
            } catch (e) {
                console.warn('Local fetch failed, trying upstream...', e);
            }
            const target = path.startsWith('http') ? path : `${UPSTREAM_BASE}${path.startsWith('/') ? '' : '/'}${path}`;
            return await fetch(target);
        }

        function openPdf(url, title = "Notes") {
            const pdfTarget = `/pdf?url=${url}`;
            const win = window.open(pdfTarget, '_blank');
            if (!win || win.closed || typeof win.closed === 'undefined') {
                openPdfModal(pdfTarget, title);
            }
        }

        function openPdfModal(pdfUrl, title) {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            const titleEl = document.getElementById('pdf-modal-title');
            const extLink = document.getElementById('pdf-external-link');
            
            titleEl.innerText = title || "Notes Viewer";
            extLink.href = pdfUrl;
            frame.src = pdfUrl;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePdfModal() {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            frame.src = "";
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function fetchBatchDetails() {
            try {
                let response = null;
                try { response = await fetch('batches.json'); } catch(e) {}
                if (!response || !response.ok) {
                    try { response = await fetch('/batches.json'); } catch(e) {}
                }
                if (!response || !response.ok) {
                    response = await fetch(`${UPSTREAM_BASE}/batches.json`);
                }
                if(!response || !response.ok) return;
                const data = await response.json();
                const allBatches = [...(data.new || []), ...(data.old || [])];
                const currentBatch = allBatches.find(b => String(b.id) === String(courseId));
                
                if(currentBatch) {
                    const hero = document.getElementById('course-hero');
                    document.getElementById('hero-thumb').src = currentBatch.thumbnail;
                    document.getElementById('hero-title').innerText = currentBatch.title;
                    hero.classList.remove('hidden');
                    hero.classList.add('flex');
                    
                    navigationStack[0].title = currentBatch.title;
                    updateBreadcrumbs();
                }
            } catch (error) {
                console.error("Failed to load batch info for header", error);
            }
        }

        function showError(message) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('content-grid').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('error-message').classList.add('flex');
            document.getElementById('error-text').innerText = message;
        }

        function goBack() {
            if (navigationStack.length > 1) { navigationStack.pop(); loadCurrentFolder(); }
            else { window.location.href = 'index.html'; }
        }

        function retryFetch() { loadCurrentFolder(); }

        function navigateToFolder(folderId, folderTitle) {
            navigationStack.push({ id: folderId, title: folderTitle });
            loadCurrentFolder();
        }

        function jumpToBreadcrumb(index) {
            navigationStack = navigationStack.slice(0, index + 1);
            loadCurrentFolder();
        }

        function updateBreadcrumbs() {
            const container = document.getElementById('breadcrumb-container');
            container.innerHTML = '';
            navigationStack.forEach((crumb, index) => {
                const isLast = index === navigationStack.length - 1;
                const btn = document.createElement('button');
                btn.className = isLast ? 'text-themeNeon pointer-events-none drop-shadow-[0_0_5px_rgba(192,132,252,0.5)]' : 'hover:text-white transition-colors';
                btn.innerText = crumb.title;
                btn.onclick = () => jumpToBreadcrumb(index);
                container.appendChild(btn);

                if (!isLast) {
                    const separator = document.createElement('i');
                    separator.setAttribute('data-lucide', 'chevron-right');
                    separator.className = 'w-3 h-3 sm:w-3.5 sm:h-3.5 text-stone-600 mx-1';
                    container.appendChild(separator);
                }
            });
            lucide.createIcons({ root: container });
        }

        function formatDateTime(dateStr) {
            if(!dateStr) return "N/A";
            const d = new Date(dateStr);
            if (isNaN(d)) return dateStr;
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatDuration(durationText, secsStr) {
            if (secsStr && parseInt(secsStr) > 0) {
                let s = parseInt(secsStr);
                const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
                return [h, m, s].map(v => v < 10 ? "0" + v : v).filter((v, i) => v !== "00" || i > 0).join(":");
            }
            if (durationText) return durationText.replace('mins', ':').replace('secs', '').replace(' ', '').trim();
            return "";
        }

        function folderFallbackIcon() {
            return `<div class="w-[72px] h-[52px] sm:w-[88px] sm:h-[64px] rounded-xl bg-[#0c0512] border border-themePurple/20 flex items-center justify-center flex-shrink-0 shadow-[inset_0_0_10px_rgba(168,85,247,0.1)]"><i data-lucide="folder" class="w-6 h-6 sm:w-7 sm:h-7 text-themePurple"></i></div>`;
        }

        function folderThumbHtml(url) {
            const safe = String(url || '').replace(/"/g, '&quot;');
            return `<div class="w-[72px] h-[52px] sm:w-[88px] sm:h-[64px] rounded-xl overflow-hidden flex-shrink-0 bg-[#0c0512] border border-themePurple/20 flex items-center justify-center shadow-[inset_0_0_10px_rgba(168,85,247,0.1)]"><img src="${safe}" alt="" loading="lazy" class="w-full h-full object-contain p-0.5" onerror="this.parentNode.outerHTML = window.__folderFallback"></div>`;
        }
        window.__folderFallback = folderFallbackIcon();

        async function loadCurrentFolder() {
            const currentFolder = navigationStack[navigationStack.length - 1];
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('error-message').classList.remove('flex');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('flex');
            document.getElementById('content-grid').classList.add('hidden');
            updateBreadcrumbs();

            try {
                const apiUrl = `/get/folder_contentsv3?course_id=${courseId}&parent_id=${currentFolder.id}&start=0`;
                const response = await resilientFetch(apiUrl);
                if (!response.ok) throw new Error("Failed to fetch data from server");
                const json = await response.json();
                if (json.status === 200 && json.data) renderContents(json.data);
                else throw new Error(json.message || "Invalid API Response");
            } catch (error) {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-message').classList.add('flex');
                document.getElementById('error-text').innerText = error.message;
            }
        }

        function renderContents(items) {
            document.getElementById('loader').classList.add('hidden');
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';
            
            if (!items || items.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('flex');
                return;
            }
            
            document.getElementById('content-grid').classList.remove('hidden');
            
            items.forEach((item, idx) => {
                const type = (item.material_type || item.type || "").toUpperCase();
                const title = item.Title || item.title || "Untitled";
                const id = item.id;
                const card = document.createElement('div');
                card.style.animationDelay = (idx * 30) + 'ms';
                card.classList.add('fade-in-up');

                if (type === "FOLDER") {
                    let counts = [];
                    if (parseInt(item.videos_count) > 0) counts.push(`${item.videos_count} Video${item.videos_count > 1 ? 's' : ''}`);
                    if (parseInt(item.files_count) > 0) counts.push(`${item.files_count} PDF${item.files_count > 1 ? 's' : ''}`);
                    if (parseInt(item.tests_count) > 0) counts.push(`${item.tests_count} Test${item.tests_count > 1 ? 's' : ''}`);
                    
                    let countText = counts.length > 0 ? counts.join(' • ') : "0 items";
                    const hasThumb = item.thumbnail && String(item.thumbnail).trim() !== '';
                    const iconHtml = hasThumb ? folderThumbHtml(item.thumbnail) : folderFallbackIcon();

                    card.className += " row-card rounded-[16px] sm:rounded-[20px] px-3.5 py-3 sm:px-4 sm:py-3.5 cursor-pointer flex items-center gap-3.5 sm:gap-4";
                    card.onclick = () => navigateToFolder(id, title);
                    card.innerHTML = `
                        ${iconHtml}
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14px] sm:text-[16px] font-bold text-stone-100 truncate">${title}</h3>
                            <p class="text-[11px] sm:text-[12px] font-semibold text-themePurple mt-0.5 tracking-wide">${countText}</p>
                        </div>
                        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/5 flex items-center justify-center">
                            <i data-lucide="chevron-right" class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-stone-400 group-hover:text-themeNeon"></i>
                        </div>
                    `;
                } else if (type === "VIDEO") {
                    const thumb = item.thumbnail || "";
                    const published = item.date_and_time || formatDateTime(item.event_date);
                    const videoId = item.id;
                    const itemCourseId = item.course_id || courseId;
                    const pdfUrl = item.pdf_link || null;
                    const encodedPdfUrl = pdfUrl ? encodeURIComponent(pdfUrl) : '';
                    const isUpcoming = parseInt(item.live_status) === 2 || (!item.file_link && !item.duration_in_secs && (!item.livestream_links || item.livestream_links.length === 0));
                    const durationStr = formatDuration(item.duration, item.duration_in_secs);
                    
                    const durationHtml = (!isUpcoming && durationStr) ? `<div class="absolute bottom-2 right-2 bg-black/80 backdrop-blur-sm border border-white/10 text-white text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 sm:px-2 sm:py-1 rounded sm:rounded-md shadow-lg">${durationStr}</div>` : '';

                    let actionHtml = '';
                    if (isUpcoming) {
                        actionHtml = `<span class="bg-themeYellow/20 text-themeYellow border border-themeYellow/30 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-md sm:rounded-lg text-[11px] sm:text-xs font-bold flex items-center gap-1.5 shadow-inner"><i data-lucide="clock" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i> Upcoming</span>`;
                    } else {
                        actionHtml = `<button onclick="window.location.href='play.html?course_id=${itemCourseId}&video_id=${videoId}'" class="bg-white hover:bg-stone-200 text-black px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-lg sm:rounded-xl text-[11px] sm:text-[12px] font-black uppercase tracking-wider flex items-center gap-1.5 btn-click-effect shadow-md"><i data-lucide="play" class="w-3 h-3 sm:w-3.5 sm:h-3.5 fill-black"></i> Watch</button>`;
                    }

                    if (pdfUrl) {
                        const safeTitle = encodeURIComponent(title);
                        actionHtml += `<button onclick="openPdf('${encodedPdfUrl}', '${safeTitle}')" class="bg-themePurple/10 text-themeNeon hover:bg-themePurple/20 border border-themePurple/30 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-lg sm:rounded-xl text-[11px] sm:text-[12px] font-bold tracking-wider flex items-center gap-1.5 btn-click-effect transition-all"><i data-lucide="file-text" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i> Notes</button>`;
                    }

                    const thumbHtml = thumb
                        ? `<img src="${thumb}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" onerror="this.remove()">`
                        : `<div class="w-full h-full flex items-center justify-center text-stone-600 bg-black"><i data-lucide="play-circle" class="w-6 h-6 sm:w-8 sm:h-8 text-themePurple opacity-50"></i></div>`;

                    card.className += " row-card rounded-[16px] sm:rounded-[24px] p-3 sm:p-4 flex flex-col sm:flex-row gap-3 sm:gap-4 relative overflow-hidden group";
                    card.innerHTML = `
                        <div class="w-full sm:w-48 aspect-video bg-[#09050d] rounded-[12px] sm:rounded-[16px] relative overflow-hidden flex-shrink-0 border border-white/5 shadow-inner">
                            ${thumbHtml}${durationHtml}
                        </div>
                        <div class="flex-1 flex flex-col justify-between min-w-0 py-0.5 sm:py-1">
                            <div>
                                <h3 class="text-[13px] sm:text-[15px] font-bold text-white leading-snug line-clamp-2 group-hover:text-themeNeon transition-colors">${title}</h3>
                                <p class="text-[11px] sm:text-xs text-stone-500 font-medium mt-1 sm:mt-1.5 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3 h-3"></i> ${published}</p>
                            </div>
                            <div class="flex items-center gap-2 mt-3 sm:mt-2 self-start">${actionHtml}</div>
                        </div>
                    `;
                } else if (type === "PDF" || type === "NOTES") {
                    const pdfUrl = item.file_link || item.pdf_link || item.download_link;
                    const encodedPdfUrl = pdfUrl ? encodeURIComponent(pdfUrl) : '';
                    const published = formatDateTime(item.event_date);
                    const safeTitle = encodeURIComponent(title);

                    card.className += " row-card rounded-[16px] sm:rounded-[20px] px-3.5 py-3 sm:px-4 sm:py-4 flex items-center justify-between gap-3 sm:gap-4 group";
                    card.innerHTML = `
                        <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl bg-themePurple/10 border border-themePurple/20 flex items-center justify-center flex-shrink-0 shadow-[inset_0_0_10px_rgba(168,85,247,0.1)] group-hover:bg-themePurple/20 transition-colors">
                                <i data-lucide="file-text" class="w-4 h-4 sm:w-5 sm:h-5 text-themeNeon"></i>
                            </div>
                            <div class="min-w-0">
                                <h3 class="text-[13px] sm:text-[15px] font-bold text-white truncate group-hover:text-themeNeon transition-colors">${title}</h3>
                                <p class="text-[11px] sm:text-xs text-stone-500 font-medium mt-0.5">${published}</p>
                            </div>
                        </div>
                        <button onclick="openPdf('${encodedPdfUrl}', '${safeTitle}')" class="bg-white hover:bg-stone-200 text-black px-3 py-1.5 sm:px-4 py-2 rounded-lg sm:rounded-xl text-[10px] sm:text-[12px] font-black uppercase tracking-wider flex items-center gap-1 sm:gap-1.5 flex-shrink-0 btn-click-effect shadow-md">
                            Open <i data-lucide="external-link" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i>
                        </button>
                    `;
                }
                grid.appendChild(card);
            });
            lucide.createIcons({ root: grid });
        }
    </script>
</body>
</html>
